    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        /* Colors - referencing CSS variables injected by React */
        --color-primary-50: var(--theme-primary-50);
        --color-primary-100: var(--theme-primary-100);
        --color-primary-200: var(--theme-primary-200);
        --color-primary-300: var(--theme-primary-300);
        --color-primary-400: var(--theme-primary-400);
        --color-primary-500: var(--theme-primary-500);
        --color-primary-600: var(--theme-primary-600);
        --color-primary-700: var(--theme-primary-700);
        --color-primary-800: var(--theme-primary-800);
        --color-primary-900: var(--theme-primary-900);
        --color-primary-950: var(--theme-primary-950);

        /* Fonts */
        --font-sans: var(--font-family), sans-serif;
        --font-serif: 'Playfair Display', serif;

        /* Animations */
        --animate-fade-in: fade-in 0.3s ease-out forwards;
        --animate-fade-in-down: fade-in-down 0.3s ease-out forwards;
        --animate-slide-up: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        --animate-scale-in: scale-in 0.2s ease-out forwards;
        --animate-float: float 3s ease-in-out infinite;
        --animate-pulse-glow: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;

        @keyframes fade-in {
          0% { opacity: 0; }
          100% { opacity: 1; }
        }
        @keyframes fade-in-down {
          0% { opacity: 0; transform: translateY(-10px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes slide-up {
          0% { opacity: 0; transform: translateY(20px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes scale-in {
          0% { opacity: 0; transform: scale(0.95); }
          100% { opacity: 1; transform: scale(1); }
        }
        @keyframes float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-5px); }
        }
        @keyframes pulse-glow {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
      }

      /* Dark Mode Configuration */
      @variant dark (&:where(.dark, .dark *));

      /* Utilities */
      @utility bg-grid-pattern {
        background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px), linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
      }
      @utility bg-grid-pattern-dark {
        background-image: linear-gradient(to right, #1e293b 1px, transparent 1px), linear-gradient(to bottom, #1e293b 1px, transparent 1px);
      }
      @utility bg-grid {
        background-size: 40px 40px;
        mask-image: linear-gradient(to bottom, transparent, 10%, black, 90%, transparent);
        -webkit-mask-image: linear-gradient(to bottom, transparent, 5%, black, 95%, transparent);
      }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Lexend:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background-color: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: rgba(148, 163, 184, 0.3);
        border-radius: 10px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background-color: rgba(71, 85, 105, 0.4);
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(148, 163, 184, 0.6);
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(71, 85, 105, 0.6);
      }
      
      /* Glassmorphism Utilities */
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .dark .glass {
        background: rgba(15, 23, 42, 0.6);
      }
    </style>
